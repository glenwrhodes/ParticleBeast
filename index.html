<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParticleBeast — WebGL2 Particle Engine</title>
    <meta name="description" content="A zero-dependency WebGL2 particle engine with a visual editor, JSON presets and Unity-grade modules: turbulence, vortex, force fields, sub-emitters and more." />
    <link rel="icon" href="/sprites/star_05.png" />
    <link rel="stylesheet" href="/demo/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src="/sprites/star_05.png" alt="" class="brand-icon" />
        <span class="brand-name">Particle<em>Beast</em></span>
      </div>
      <nav class="site-nav" aria-label="Site">
        <a href="/" class="active" aria-current="page">Demos</a>
        <a href="/editor.html">Editor</a>
        <a href="/downloads.html">Downloads</a>
      </nav>
    </header>

    <main class="demo-main">
      <section class="viewport-wrap" aria-label="Effect preview">
        <canvas id="viewport" aria-label="3D particle effect preview. Drag to orbit, scroll to zoom."></canvas>
        <div class="viewport-hud">
          <div class="hud-left">
            <h1 id="fx-name">Loading…</h1>
            <p id="fx-desc"></p>
            <div class="tints" id="tints" role="group" aria-label="Tint color swatches"></div>
          </div>
          <div class="hud-right">
            <div class="stats" id="stats" aria-live="off">— fps · — particles</div>
            <div class="hud-buttons">
              <button id="replay" class="btn" aria-label="Replay effect">Replay</button>
              <a id="open-editor" class="btn btn-ghost" href="/editor.html" aria-label="Open this effect in the editor">Open in editor</a>
            </div>
          </div>
        </div>
        <p class="hint" aria-hidden="true">drag to orbit · scroll to zoom · click viewport to trigger</p>
      </section>

      <section class="cards" id="cards" aria-label="Effect presets"></section>
    </main>

    <footer class="site-footer">
      <p>ParticleBeast — embeddable WebGL2 particles. Grab the library on the <a href="/downloads.html">downloads page</a>.</p>
    </footer>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
